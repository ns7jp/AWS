name: validate

# push / pull request のたびに、リポジトリ内のスクリプト・設定ファイル・ドキュメントを
# 静的に検証します(実AWS環境には接続しません。課金は発生しません)。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck and PyYAML
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck python3-yaml

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Run validate.sh
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh

      - name: EC2 cleanup regression tests (mock AWS CLI, no AWS access)
        run: python3 scripts/test_ec2_cleanup.py

      - name: EC2 build ownership regression tests (mock AWS CLI, no AWS access)
        run: python3 scripts/test_ec2_build_ownership.py

      - name: terraform validate (level 6 kit, no AWS access)
        run: |
          for env_dir in projects/06-iac-cicd/handson/environments/*/; do
            echo "== ${env_dir} =="
            (cd "${env_dir}" && terraform init -backend=false -input=false && terraform validate)
          done

      - name: tfsec (level 6 kit, static security scan)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: projects/06-iac-cicd/handson
          # 学習用ポートフォリオのため、まずは検知結果を可視化するだけに留め
          # CIをブロックしない設定にしています(既知の指摘を確認・整理したら段階的に厳格化する想定)。
          soft_fail: true
          # tfsec本体のダウンロード時にGitHub APIを匿名で呼び出すとレート制限(403)に
          # かかることがあるため、認証済みリクエストにしてこれを防ぐ。
          github_token: ${{ secrets.GITHUB_TOKEN }}
